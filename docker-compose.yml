version: "3.9"

services:

  # ─────────────────────────────────────────
  # Base de datos MySQL
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: innovatech-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-innovatech}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "3306:3306"
    volumes:
      # Named volume: los datos persisten aunque el contenedor
      # se reinicie o elimine. Se prefiere sobre bind mount porque
      # no depende de rutas del host y es gestionado por Docker.
      - db_data:/var/lib/mysql
    networks:
      - innovatech-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Backend Node.js
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innovatech-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-innovatech}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - innovatech-net

# ─────────────────────────────────────────
# Volumen named para persistencia de datos
# ─────────────────────────────────────────
volumes:
  db_data:
    driver: local

# ─────────────────────────────────────────
# Red interna entre servicios
# ─────────────────────────────────────────
networks:
  innovatech-net:
    driver: bridge
