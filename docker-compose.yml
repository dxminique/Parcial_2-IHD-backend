version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: innovatech-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: innovatech
      MYSQL_USER: admin
      MYSQL_PASSWORD: password123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - innovatech-net

  backend:
    image: 637423223864.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend:latest
    container_name: innovatech-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: password123
      DB_NAME: innovatech
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - innovatech-net

volumes:
  db_data:

networks:
  innovatech-net:
