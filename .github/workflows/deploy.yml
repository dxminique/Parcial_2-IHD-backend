name: CI/CD Backend - Innovatech Chile

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: innovatech-backend
  IMAGE_TAG: ${{ github.sha }}
  EC2_INSTANCE_ID: i-0bf9839e1981e20d7

jobs:

  # ────────────────────────────────────────
  # JOB 1: Build y Push a ECR
  # ────────────────────────────────────────
  build-and-push:
    name: Build y Push imagen a ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen Docker (multi-stage)
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Push imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Imagen publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ────────────────────────────────────────
  # JOB 2: Deploy en EC2 via SSM
  # ────────────────────────────────────────
  deploy:
    name: Deploy en EC2 Backend via SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy en EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin '"$ECR_REGISTRY"'","sudo docker pull '"$IMAGE_URI"'","sudo docker stop innovatech-backend innovatech-db || true","sudo docker rm innovatech-backend innovatech-db || true","sudo docker network create innovatech-net || true","sudo docker volume create db_data || true","sudo docker run -d --name innovatech-db --network innovatech-net --restart unless-stopped -e MYSQL_ROOT_PASSWORD='"$DB_ROOT_PASSWORD"' -e MYSQL_DATABASE=innovatech -e MYSQL_USER=admin -e MYSQL_PASSWORD='"$DB_PASSWORD"' -v db_data:/var/lib/mysql mysql:8.0","sleep 20","sudo docker run -d --name innovatech-backend --network innovatech-net --restart unless-stopped -p 3000:3000 -e PORT=3000 -e DB_HOST=innovatech-db -e DB_USER=admin -e DB_PASSWORD='"$DB_PASSWORD"' -e DB_NAME=innovatech '"$IMAGE_URI"'","sleep 10","curl -f http://localhost:3000/health && echo Deploy exitoso || echo Health check fallo"]' \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Estado: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy exitoso!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deploy fallido"
              exit 1
            fi
            sleep 15
          done